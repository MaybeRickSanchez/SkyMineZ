# ---------------------------------------------------------------------------
# SkyMineZ
# Every value below can be changed while the server is running, but the
# plugin only re-reads the file after /skymine reload.
# ---------------------------------------------------------------------------

# Prefix prepended to every message the plugin sends. Leave empty for none.
prefix: "§b§lSkyMine §7§8| §r"

# ---------------------------------------------------------------------------
# Server identity
# ---------------------------------------------------------------------------
server:
  # Shown on sidebars and leaderboard footers instead of the detected IP.
  # Leave empty to auto-detect (ip or ip:port).
  address-override: ""

# ---------------------------------------------------------------------------
# Sidebar (scoreboard)
# ---------------------------------------------------------------------------
scoreboard:
  # Seconds a player must stay inside the welcome zone before the welcome
  # screen is replaced by the stats screen.
  spawn-welcome-seconds: 60
  # Seconds a player may stay outside the zone before falling back to the
  # stats screen. Prevents flicker when someone walks two blocks away.
  spawn-leave-seconds: 5
  # Fallback when no mid-lobby zone is set (/hub setmidzone): radius around
  # the mid-lobby point (or the default world spawn) that counts as "spawn".
  spawn-radius: 3.0
  # How many players get their sidebar refreshed per tick. Lower this if you
  # see tick spikes on very busy servers.
  players-per-tick: 4
  # Ticks between two sidebar refresh passes (20 = once per second).
  update-ticks: 20

  lobby:
    title: "§d§lSkyMine"
    lines:
      - "§f"
      - "§d{prefix_name}"
      - "§f"
      - "§eGOLD: §f{gold}"
      - "§eMONEY: §f{money}"
      - "§eMINED: §f{mined}"
      - "§eDEATHS: §f{deaths}"
      - "§eKILL STREAK: §f{kill_streak}"
      - "§eKILLS: §f{kills}"
      - "§ePVP: §f{pvp}"
      - "§f"
      - "§aSERVER.IP §f{server_address}"

  welcome:
    title: "§d§lSkyMine"
    lines:
      - "§f"
      - "§d§lBE SKYMINE KHOSH AMADID!"
      - "§f"
      - "§7HADAF SHOMA IN AST KE ORE"
      - "§7HA RA MINE KONID, TOOLS VA"
      - "§7ARMOR KHOD RA ERTEQA DAHID"
      - "§7VA BE ANDAZEI GHAVI SHAVID"
      - "§7KE BE MINE HAYE SAKHT"
      - "§7NOFOZ KONID VA BA PLAYERS,"
      - "§7MOBS, VA BOSS HA RO BE RO"
      - "§7SHAVID."
      - "§f"
      - "§aSERVER.IP §f{server_address}"

  duel:
    title: "§c§lDuel"
    lines:
      - "§f"
      - "§c{team} §7vs §c{enemy}"
      - "§f"
      - "§eTIME: §f{duel_time}"
      - "§eKILLS: §f{kills}"
      - "§eDEATHS: §f{deaths}"
      - "§eSTREAK: §f{kill_streak}"
      - "§f"
      - "§aSERVER.IP §f{server_address}"

# ---------------------------------------------------------------------------
# PvP
# ---------------------------------------------------------------------------
pvp:
  # Whether PvP is enabled for a player who never changed the setting.
  default-enabled: true
  # Message shown when someone tries to hit a player who has PvP off.
  disabled-message: "§c{player} has PvP disabled."

# ---------------------------------------------------------------------------
# Economy
# ---------------------------------------------------------------------------
economy:
  # Balance given to a player the first time they join. Applied only when the
  # player has no entry in money_economy.json / gold_economy.json yet.
  money-default: 0
  gold-default: 0

# ---------------------------------------------------------------------------
# Crates
# ---------------------------------------------------------------------------
crates:
  # Opening without holding a valid key is refused. Turn off for free crates.
  require-key: true
  # Eat exactly one key when an opening starts. Turn off for unlimited keys.
  consume-key: true
  # Shulker color for newly created crates (purple, red, lime, ...).
  default-color: purple
  # Total frames played before the winner is revealed.
  animation-steps: 36
  # Ticks between revealing the reward and handing it over.
  reveal-delay: 20
  # Ticks per frame while the crate is spinning, keyed by the first frame
  # index of the range.
  animation-delays:
    "0": 2
    "12": 3
    "22": 4
    "29": 5
    "34": 7

# ---------------------------------------------------------------------------
# Mines
# ---------------------------------------------------------------------------
mines:
  # Default seconds between two automatic resets. A mine can override this
  # with /mine setinterval.
  reset-interval: 300
  # Blocks written per tick while a mine is filling. Lower this value if
  # resetting a large mine causes a tick spike.
  blocks-per-tick: 3000

# ---------------------------------------------------------------------------
# Outposts
# ---------------------------------------------------------------------------
outposts:
  # Ticks between two outpost ticks.
  tick-interval: 20
  # How many capture points a player gains per tick while inside an outpost.
  capture-min: 1
  capture-max: 3
  # Capture points needed to own an outpost.
  capture-required: 100
  # Seconds an outpost stays locked after it has been captured.
  cooldown-duration: 1800
  # Seconds between two gold payouts for the owner, and the chance in percent
  # that a payout actually happens when the timer elapses.
  gold-interval: 600
  gold-chance: 50
  gold-reward: 1

# ---------------------------------------------------------------------------
# Lobby
# ---------------------------------------------------------------------------
lobby:
  # Where players go on join: first = only players who never played before,
  # always = everybody on every join, never = no automatic teleport.
  # /hub and /lobby always work regardless of this setting.
  join-teleport: first
  # When true, the lobby map (the world holding the /hub target) is build
  # protected: players without operator status or the admin permission can
  # neither break, place nor right-click blocks there. Crates, slapper
  # blocks and mines keep working because their own handlers own them.
  protection-enabled: true
  # Cancel fall damage anywhere inside the lobby map.
  no-fall-damage: true
  # Cancel void damage inside the lobby map and pull the player back onto
  # solid ground above them (or to the lobby when there is none).
  void-rescue: true
  # Freeze hunger inside the lobby map.
  no-hunger: true

# ---------------------------------------------------------------------------
# Teams and duels
# ---------------------------------------------------------------------------
teams:
  # Seconds a team invitation stays valid.
  invite-seconds: 120
  # Seconds a duel challenge stays valid before it expires.
  challenge-seconds: 60
  # Maximum duel length in seconds. When it runs out the duel ends in a draw
  # and everybody returns to where they fought from.
  duel-seconds: 600
  # XP the winning team earns per duel victory.
  duel-win-xp: 50
  # XP needed for one team level.
  xp-per-level: 100
  # Duel arena rendezvous, set in-game with /team arena seta|setb (admin).
  # Side A members teleport to arena-a, side B to arena-b when a duel starts;
  # an unset side fights where it stands. Everybody returns afterwards.
  #arena-a: {world: world, x: 0.5, y: 64.0, z: 0.5, yaw: 0.0, pitch: 0.0}
  #arena-b: {world: world, x: 10.5, y: 64.0, z: 0.5, yaw: 180.0, pitch: 0.0}

# ---------------------------------------------------------------------------
# Daily quests
# ---------------------------------------------------------------------------
quests:
  # type: mine = break blocks, kill = defeat players, earn = gain money.
  # target: how many. reward-money / reward-gold: paid once per day per quest.
  list:
    - id: miner_1
      name: "Apprentice Miner"
      desc: "Mine 50 blocks"
      type: mine
      target: 50
      reward-money: 100
      reward-gold: 0
    - id: hunter_1
      name: "First Blood"
      desc: "Defeat 1 player"
      type: kill
      target: 1
      reward-money: 150
      reward-gold: 1
    - id: earner_1
      name: "Pocket Money"
      desc: "Earn 500 money"
      type: earn
      target: 500
      reward-money: 50
      reward-gold: 0

# ---------------------------------------------------------------------------
# Shop (categories with buy/sell prices; item names use /give syntax)
# ---------------------------------------------------------------------------
shop:
  categories:
    - id: blocks
      name: "Blocks"
      items:
        - {item: stone, count: 16, buy: 32, sell: 8}
        - {item: cobblestone, count: 16, buy: 24, sell: 6}
        - {item: oak_log, count: 8, buy: 40, sell: 10}
    - id: ores
      name: "Ores"
      items:
        - {item: coal, count: 8, buy: 80, sell: 20}
        - {item: iron_ingot, count: 4, buy: 120, sell: 30}
        - {item: diamond, count: 1, buy: 500, sell: 150}

# ---------------------------------------------------------------------------
# Progression gear (tools and armor)
# ---------------------------------------------------------------------------
tools:
  # XP earned per block broken while holding gear.
  xp-per-block: 1
  # Hard cap. Nobody upgrades past this, whatever they own.
  max-level: 10
  # Total XP banked to be eligible for a level: (level - 1) * xp-per-level.
  xp-per-level: 100
  # Upgrade packages per target level: enchantments granted + materials eaten.
  upgrades:
    - level: 2
      enchants: {efficiency: 1}
      materials:
        - {item: iron_ingot, count: 16}
    - level: 3
      enchants: {efficiency: 2, unbreaking: 1}
      materials:
        - {item: iron_ingot, count: 32}
        - {item: coal, count: 16}
    - level: 4
      enchants: {efficiency: 3, fortune: 1}
      materials:
        - {item: diamond, count: 4}

# ---------------------------------------------------------------------------
# Composer (material processing recipes)
# ---------------------------------------------------------------------------
composer:
  recipes:
    - id: compact_coal
      name: "Compact Coal"
      inputs:
        - {item: coal, count: 9}
      output: {item: coal_block, count: 1}
    - id: bread
      name: "Bread"
      inputs:
        - {item: wheat, count: 3}
      output: {item: bread, count: 1}

# ---------------------------------------------------------------------------
# Trading
# ---------------------------------------------------------------------------
trade:
  # Seconds a trade request stays valid.
  request-seconds: 60
  # Seconds an open trade session may idle before items are returned.
  session-seconds: 300

# ---------------------------------------------------------------------------
# Lag protection
# ---------------------------------------------------------------------------
lagmaker:
  enabled: true
  # Merge item entities that spawn next to each other. Strongly recommended:
  # it keeps the entity count low when players spam-drop stacks.
  auto-stack: true
  # Block radius used when looking for a nearby item entity to merge into.
  stack-radius: 1.5
  # Max item entities a single player may have on the ground before further
  # drops are refused. 0 disables the limit.
  max-drops-per-player: 15
  cleanup:
    # off = never despawn anything
    # ttl = despawn item entities older than ttl-seconds
    # all = despawn every item entity on every world
    mode: ttl
    ttl-seconds: 900
    # Ticks between two cleanup passes (20 * 60 * 30 = 30 minutes).
    interval: 36000
    # Item entities despawned per tick during a cleanup pass.
    per-tick: 200

